name: CI

on:
  push:
    # Pull-request branches are covered by the pull_request trigger below.
    # Keep push CI only for direct updates to the protected branch so each PR
    # produces one authoritative Unit/Guard/Episode/Aggregate run.
    branches: [main]
  pull_request:
    branches: ["**"]

# The test jobs are intentionally independent so a late failure in one
# group does not wait for the other groups to finish. The `test` job below is
# the single aggregate status to keep required branch protection unchanged.
jobs:
  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      CI_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/holahola_ci
      NEON_SHARED_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/holahola_ci
      DEFAULT_OBJECT_STORAGE_BUCKET_ID: ${{ secrets.DEFAULT_OBJECT_STORAGE_BUCKET_ID }}
      AWS_S3_ENDPOINT: ${{ secrets.AWS_S3_ENDPOINT }}
      AWS_S3_ACCESS_KEY_ID: ${{ secrets.AWS_S3_ACCESS_KEY_ID }}
      AWS_S3_SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_SECRET_ACCESS_KEY }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: holahola_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d holahola_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      # v5 actions run on Node 24 internally. The application itself remains
      # on Node 20 below, so the action-runtime deprecation warning is handled
      # independently from application test failures.
      #
      # fetch-depth: 0 (full history, not the default shallow single-commit
      # clone) is required here: detect-episode-dialogue-loss.ts --self-check
      # anchors its fixture to real, specific historical commit SHAs (the Sep
      # 21 2026 episode-34 incident) and fails its own setup if it cannot
      # `git show`/`git cat-file` them. A shallow clone silently lacks those
      # commits and the self-check fails with "could not read one or more
      # fixture commits" -- confirmed on a real GitHub Actions run.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      # server/services/alden-functions.ts's search_code tool prefers `rg`
      # (ripgrep) and transparently falls back to a bounded JS scan when it's
      # absent from PATH -- but GitHub's ubuntu-latest runner does not ship
      # rg by default, unlike the Replit dev sandbox (nix). Without this,
      # test-alden-coordination-e2e.test.ts's "rg path should carry no
      # fallback note" assertion fails: it deliberately forces the
      # rg-available branch to prove parity with the fallback branch, and
      # that branch can only be exercised for real when rg actually exists.
      # Confirmed missing on a real GitHub Actions run 2026-09-25.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Validate package lock registry URLs
        run: npm run test:package-lock-registry

      - name: Install dependencies
        # `tsx` is a development dependency, and the tests must use this
        # checked-in toolchain instead of letting npx download an unrelated
        # temporary version.
        run: npm ci --include=dev

      - name: Verify local test runtime dependencies
        run: |
          test -x node_modules/.bin/tsx
          node --input-type=module -e "
            const { eq } = await import('drizzle-orm');
            if (typeof eq !== 'function') throw new Error('drizzle-orm did not expose eq');
            console.log('[ci] drizzle-orm resolves from the application import path');
          "

      - name: Test production uptime monitor
        run: npm run test:production-uptime-monitor

      - name: Prepare isolated CI database
        run: |
          npx tsx server/scripts/test-ci-database-adapter-guard.ts
          npx drizzle-kit migrate
          npx tsx server/scripts/test-context-lineage-ci-execution.ts
          npx tsx server/scripts/setup-ci-test-database.ts

      - name: Run unit tests
        run: npm run test:ci:unit

  test-guards:
    name: Guard checks
    runs-on: ubuntu-latest
    env:
      CI_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/holahola_ci
      NEON_SHARED_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/holahola_ci
      DEFAULT_OBJECT_STORAGE_BUCKET_ID: ${{ secrets.DEFAULT_OBJECT_STORAGE_BUCKET_ID }}
      AWS_S3_ENDPOINT: ${{ secrets.AWS_S3_ENDPOINT }}
      AWS_S3_ACCESS_KEY_ID: ${{ secrets.AWS_S3_ACCESS_KEY_ID }}
      AWS_S3_SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_SECRET_ACCESS_KEY }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: holahola_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d holahola_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Validate package lock registry URLs
        run: npm run test:package-lock-registry

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify local test runtime dependencies
        run: |
          test -x node_modules/.bin/tsx
          node --input-type=module -e "
            const { eq } = await import('drizzle-orm');
            if (typeof eq !== 'function') throw new Error('drizzle-orm did not expose eq');
            console.log('[ci] drizzle-orm resolves from the application import path');
          "

      - name: Prepare isolated CI database
        run: |
          npx tsx server/scripts/test-ci-database-adapter-guard.ts
          npx drizzle-kit migrate
          npx tsx server/scripts/setup-ci-test-database.ts

      - name: Run guard checks
        run: npm run test:ci:guards

  test-episodes:
    name: Episode and North Star checks
    runs-on: ubuntu-latest
    env:
      CI_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/holahola_ci
      NEON_SHARED_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/holahola_ci
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: holahola_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d holahola_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Validate package lock registry URLs
        run: npm run test:package-lock-registry

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify local test runtime dependencies
        run: |
          test -x node_modules/.bin/tsx
          node --input-type=module -e "
            const { eq } = await import('drizzle-orm');
            if (typeof eq !== 'function') throw new Error('drizzle-orm did not expose eq');
            console.log('[ci] drizzle-orm resolves from the application import path');
          "

      - name: Prepare isolated CI database
        run: |
          npx tsx server/scripts/test-ci-database-adapter-guard.ts
          npx drizzle-kit migrate
          npx tsx server/scripts/setup-ci-test-database.ts

      - name: Run episode and North Star checks
        run: npm run test:ci:episodes

  test-windows-powershell:
    name: Windows PowerShell authority checks
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Run Coordinator V2 Windows reauthorization checks
        shell: powershell
        run: .\scripts\test-hola-coordinator-reauthorization.ps1

      - name: Run read-only recovery clock checks (native PowerShell 5.1)
        shell: powershell
        run: .\scripts\test-hola-coordinator-clock-preflight.ps1

      # Local Read-only Worker native Job Object launcher suite (synthetic
      # cmd/ping processes only; no model, no harness qualification). Same
      # dependency policy as the Linux jobs: validate the checked-in lockfile's
      # registry URLs, install exactly that lockfile including dev dependencies
      # (tsx), and refuse to let npx fetch a missing runner.
      - name: Validate package lock registry URLs
        shell: pwsh
        run: npm run test:package-lock-registry

      - name: Install dependencies
        shell: pwsh
        run: npm ci --include=dev

      - name: Verify local test runtime dependencies
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'node_modules\.bin\tsx.cmd')) { throw 'tsx is not installed from the lockfile' }
          node --input-type=module -e "const { z } = await import('zod'); if (typeof z?.object !== 'function') throw new Error('zod did not resolve'); console.log('[ci] zod resolves from the application import path');"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Local Read-only Worker native Job Object launcher tests
        shell: pwsh
        run: npx --no-install tsx --test --test-concurrency=1 server/services/local-worker/job-launcher.test.ts

      - name: Run Local Read-only Worker native Windows state store tests
        shell: pwsh
        run: |
          npx --no-install tsx --test --test-concurrency=1 --test-reporter=tap server/services/local-worker/ports.test.ts | Tee-Object -Variable tap
          $code = $LASTEXITCODE
          if ($code -ne 0) { Write-Error "[ci] ports.test.ts exited with $code"; exit $code }
          # The Windows-gated state-store tests must actually run here, not skip.
          $summary = $tap | Select-String -Pattern '^# skipped (\d+)$' | Select-Object -Last 1
          $skipped = if ($summary) { $summary.Matches[0].Groups[1].Value } else { 'missing' }
          if ($skipped -ne '0') { Write-Error "[ci] ports.test.ts skipped count was '$skipped', expected 0"; exit 1 }

  test:
    if: ${{ always() }}
    needs:
      - test-unit
      - test-guards
      - test-episodes
      - test-windows-powershell
    runs-on: ubuntu-latest

    steps:
      - name: Report aggregate result
        env:
          UNIT_RESULT: ${{ needs.test-unit.result }}
          GUARDS_RESULT: ${{ needs.test-guards.result }}
          EPISODES_RESULT: ${{ needs.test-episodes.result }}
          WINDOWS_POWERSHELL_RESULT: ${{ needs.test-windows-powershell.result }}
        run: |
          echo "[ci] unit tests: ${UNIT_RESULT}"
          echo "[ci] guard checks: ${GUARDS_RESULT}"
          echo "[ci] episode and North Star checks: ${EPISODES_RESULT}"
          echo "[ci] Windows PowerShell authority checks: ${WINDOWS_POWERSHELL_RESULT}"

          if [[ "${UNIT_RESULT}" != "success" ||
                "${GUARDS_RESULT}" != "success" ||
                "${EPISODES_RESULT}" != "success" ||
                "${WINDOWS_POWERSHELL_RESULT}" != "success" ]]; then
            echo "[ci] one or more test groups failed; see the named group job for the exact command"
            exit 1
          fi

          echo "[ci] all test groups passed"
