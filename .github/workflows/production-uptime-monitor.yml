name: Production uptime monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: production-uptime-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Check production readiness
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Secrets live in the `monitors` Environment (deployment branch: main only),
    # so a workflow on any other branch cannot read them. Phase S, plan efb1e3d1.
    environment: monitors

    steps:
      - name: Check out monitor
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Run production uptime monitor
        env:
          PRIMARY_URL: https://getholahola.com/health/readiness
          SECONDARY_URL: https://hola-hola.replit.app/health/readiness
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          PROD_ALERT_TO_NUMBER: ${{ secrets.PROD_ALERT_TO_NUMBER }}
        run: node scripts/production-uptime-monitor.mjs
