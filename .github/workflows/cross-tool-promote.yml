name: Cross-Tool Promote

# The external-tool entry point into main — for any caller that isn't
# Replit's own persistent dev checkout (that one has its own,
# server/services/source-control-service.ts, "source-promotion" — a
# deliberately separate, differently-scoped system, not a duplicate; see
# the "Two entry points" note in the design doc below).
#
# Isolated execution venue, deliberately NOT run on the Replit process
# serving live Daniela/David traffic. Runs the same validation any human PR
# gets (typecheck, build, the three test:ci:* groups) plus the
# ephemeral-Neon-branch gate, then fast-forwards main over HTTPS using a
# short-lived GitHub App installation token (minted by
# server/services/github-app-auth.ts via scripts/print-github-app-token.ts) —
# the same mechanism server/services/source-control-service.ts uses for its
# own fast-forward push. No long-lived SSH deploy key in this path.
# See docs/superpowers/specs/2026-08-26-unified-source-promote-endpoint-design.md.
#
# A branch-clone gate pass IS the trust boundary here, the same way a green
# CI run is what lets this workflow push code with no human re-reviewing
# each commit — so a pending migration or data-op (see
# .agents/skills/data-ops/SKILL.md, scripts/data-ops/) that survives the
# gate (applied to a real clone of production, full test suite run against
# it) is applied to the real shared database automatically, right after the
# gate and before the code that may depend on it lands. No separate manual
# `drizzle-kit migrate` step, and no dedicated secret for any of this either
# — it reuses NEON_API_KEY/NEON_PROJECT_ID (already present below) to fetch
# production's own direct connection string on demand via
# scripts/neon-branch.ts, the same way the gate step already does for its
# disposable clone. Data-ops rely on being written idempotently (checked by
# the gate re-running them, not just running once) rather than on any
# separate "already applied" tracking. One real asymmetry worth naming
# honestly: unlike a code push, a bad migration or data change against the
# single shared database is not always cleanly reversible (e.g. a dropped
# column, a deleted row) — accepted because the gate tests against real
# production-cloned data, not a fixture, not because the risk is zero.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to validate and fast-forward main to"
        required: true
        type: string
      expectedSha:
        description: "Exact verified promotion commit"
        required: true
        type: string
      jobId:
        description: "Correlation id the triggering caller uses to find this run"
        required: true
        type: string

run-name: "cross-tool-promote ${{ inputs.jobId }} (${{ inputs.branch }})"

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      NEON_SHARED_DATABASE_URL: ${{ secrets.NEON_SHARED_DATABASE_URL }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      DEFAULT_OBJECT_STORAGE_BUCKET_ID: ${{ secrets.DEFAULT_OBJECT_STORAGE_BUCKET_ID }}
      AWS_S3_ENDPOINT: ${{ secrets.AWS_S3_ENDPOINT }}
      AWS_S3_ACCESS_KEY_ID: ${{ secrets.AWS_S3_ACCESS_KEY_ID }}
      AWS_S3_SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_SECRET_ACCESS_KEY }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      DEV_TEST_ACCOUNT_PASSWORD: ${{ secrets.DEV_TEST_ACCOUNT_PASSWORD }}
    steps:
      - name: Validate pinned promotion inputs
        env:
          PROMOTION_BRANCH: ${{ inputs.branch }}
          EXPECTED_SHA: ${{ inputs.expectedSha }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid expected SHA"; exit 1; }
          [[ "$PROMOTION_BRANCH" =~ ^[A-Za-z0-9._/-]+$ && ${#PROMOTION_BRANCH} -le 200 && "$PROMOTION_BRANCH" != -* && "$PROMOTION_BRANCH" != *..* ]] || { echo "::error::Invalid promotion branch"; exit 1; }
          git check-ref-format --branch "$PROMOTION_BRANCH"

      - name: Verify promotion branch before checkout
        env:
          PROMOTION_BRANCH: ${{ inputs.branch }}
          EXPECTED_SHA: ${{ inputs.expectedSha }}
          PROMOTION_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const branch = process.env.PROMOTION_BRANCH;
          const expected = process.env.EXPECTED_SHA;
          if (!/^[0-9a-f]{40}$/.test(expected ?? '') || !/^[A-Za-z0-9._/-]+$/.test(branch ?? '') ||
              branch.startsWith('-') || branch.includes('..') || branch.length > 200) {
            throw new Error('Invalid pinned promotion inputs');
          }
          const endpoint = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/git/ref/heads/${encodeURIComponent(branch)}`;
          const response = await fetch(endpoint, {
            headers: {
              Authorization: `Bearer ${process.env.PROMOTION_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
            },
            redirect: 'error', signal: AbortSignal.timeout(15000),
          });
          if (!response.ok) throw new Error('Cannot verify promotion branch before checkout');
          const ref = await response.json();
          if (ref.ref !== `refs/heads/${branch}` || ref.object?.type !== 'commit' || ref.object?.sha !== expected) {
            throw new Error('Promotion branch moved before checkout');
          }
          NODE

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expectedSha }}
          fetch-depth: 0

      - name: Refuse a moved promotion branch
        env:
          PROMOTION_BRANCH: ${{ inputs.branch }}
          EXPECTED_SHA: ${{ inputs.expectedSha }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const branch = process.env.PROMOTION_BRANCH;
          const expected = process.env.EXPECTED_SHA;
          if (!/^[0-9a-f]{40}$/.test(expected ?? '') || !/^[A-Za-z0-9._/-]+$/.test(branch ?? '') ||
              branch.startsWith('-') || branch.includes('..') || branch.length > 200) {
            throw new Error('Invalid pinned promotion inputs');
          }
          const git = args => execFileSync('git', args, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }).trim();
          const remote = git(['ls-remote', '--heads', 'origin', `refs/heads/${branch}`]);
          if (remote !== `${expected}\trefs/heads/${branch}`) throw new Error('Promotion branch moved after verification');
          if (git(['rev-parse', 'HEAD']) !== expected) throw new Error('Checkout differs from verified SHA');
          NODE

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Refuse if main is not an ancestor of this branch
        run: |
          git fetch origin main --no-tags
          # A bare `git fetch <remote> <branch>` updates FETCH_HEAD, not the
          # origin/<branch> remote-tracking ref — read FETCH_HEAD directly,
          # the same proven pattern scripts/source-bridge.sh already uses,
          # rather than trusting origin/main to have been updated.
          MAIN_SHA="$(git rev-parse --verify FETCH_HEAD^{commit})"
          if ! git merge-base --is-ancestor "$MAIN_SHA" HEAD; then
            echo "::error::main is not an ancestor of ${{ inputs.branch }} — diverged or behind. Refusing to promote."
            exit 1
          fi

      - name: Validate package lock registry URLs
        run: npm run test:package-lock-registry

      - name: Install PostgreSQL test binaries
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql
          POSTGRES_BINDIR="$(pg_config --bindir)"
          test -x "$POSTGRES_BINDIR/initdb"
          test -x "$POSTGRES_BINDIR/postgres"
          echo "$POSTGRES_BINDIR" >> "$GITHUB_PATH"

      # Same as ci.yml's unit job: test-alden-coordination-e2e.test.ts exercises
      # Alden's search_code rg path, which needs ripgrep on the runner.
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Check episode files for silent content loss
        run: |
          # This job pushes straight to main from outside Replit (see the
          # "Fast-forward main and push" step below), bypassing
          # server/services/source-control-service.ts's syncLocked() guard
          # entirely — so it needs its own copy of the same check rather
          # than relying on that chokepoint. A fresh fetch here (not the
          # MAIN_SHA computed in "Refuse if main is not an ancestor" above,
          # which is a step-local shell variable and isn't visible here)
          # keeps this close to the actual comparison being made.
          git fetch origin main --no-tags
          MAIN_SHA="$(git rev-parse --verify FETCH_HEAD^{commit})"
          npx tsx server/scripts/check-episode-content-loss.ts --old-ref "$MAIN_SHA" --new-ref HEAD

      - name: Typecheck
        run: npm run check

      - name: Build
        run: npm run build

      - name: Validate migration + data-ops + full test suite on an isolated Neon branch
        run: npm run db:branch -- gate

      - name: Re-verify main has not advanced since the earlier ancestry check
        run: |
          # The ancestry check in "Refuse if main is not an ancestor of this
          # branch" ran before the typecheck/build/Neon-branch-gate steps
          # above -- a real gap, several minutes long, in which a different
          # actor (Replit's source-control coordinator, or another
          # cross-tool-promote run) could have pushed to main. The next step
          # applies a migration + data-ops directly to the single shared
          # production database -- a real, not-always-reversible side effect
          # (see the file header) -- so it must never run against a main that
          # has moved since it was last validated. A stale-but-still-attempted
          # run here would otherwise mutate production for a promotion that
          # then fails (non-fast-forward) at the final push step below,
          # leaving production changed without the corresponding code
          # landing.
          #
          # This does not shrink the race window to zero -- main could still
          # move in the few seconds between this check and the push -- but it
          # shrinks it from "the whole pipeline's duration" down to "a few
          # seconds", using the same fast-forward-ancestry guarantee the
          # final push already enforces, checked again immediately before the
          # irreversible step instead of only long before it.
          git fetch origin main --no-tags
          MAIN_SHA="$(git rev-parse --verify FETCH_HEAD^{commit})"
          if ! git merge-base --is-ancestor "$MAIN_SHA" HEAD; then
            echo "::error::main advanced past this branch while validation was running (now at $MAIN_SHA) -- refusing to mutate production for a stale candidate. Re-run cross-tool-promote against the current main."
            exit 1
          fi

      - name: Apply migration + data-ops to production (gate-approved)
        run: |
          # Direct (unpooled) connection string, required for drizzle-kit —
          # never the pooled NEON_SHARED_DATABASE_URL secret above. Fetched
          # fresh each run via the Management API (NEON_API_KEY /
          # NEON_PROJECT_ID), not stored as its own secret, the same
          # resolve-don't-assume approach neon-branch.ts already uses
          # everywhere else.
          PROD_DIRECT_URL="$(npx tsx scripts/neon-branch.ts connection-string production)"
          NEON_SHARED_DATABASE_URL="$PROD_DIRECT_URL" npx drizzle-kit migrate
          NEON_SHARED_DATABASE_URL="$PROD_DIRECT_URL" npx tsx scripts/run-data-ops.ts

      - name: Fast-forward main and push
        env:
          HOLAHOLA_GITHUB_APP_ID: ${{ secrets.HOLAHOLA_GITHUB_APP_ID }}
          HOLAHOLA_GITHUB_APP_INSTALLATION_ID: ${{ secrets.HOLAHOLA_GITHUB_APP_INSTALLATION_ID }}
          HOLAHOLA_GITHUB_APP_PRIVATE_KEY: ${{ secrets.HOLAHOLA_GITHUB_APP_PRIVATE_KEY }}
        run: |
          # actions/checkout (default persist-credentials: true) leaves a
          # `http.https://github.com/.extraheader` config entry in this
          # job's local .git/config, carrying the default GITHUB_TOKEN. It's
          # scoped to the same "https://github.com/" prefix as the push URL
          # below, and curl/git send an already-configured Authorization
          # header instead of the one implied by URL-embedded credentials --
          # a userinfo credential does not replace it. Left in place, this
          # push silently authenticates as github-actions[bot] (the default
          # token's identity) instead of the GitHub App installation, and
          # branch protection on main denies github-actions[bot] with a 403
          # (observed in run 35378467309 / job 105708715641). The earlier
          # "Refuse if main is not an ancestor" step still needs that
          # persisted credential for its own read-only fetch, so it's only
          # removed here, right before the push that must use the App token.
          git config --unset-all http.https://github.com/.extraheader || true
          GH_APP_TOKEN="$(npx tsx scripts/print-github-app-token.ts)"
          echo "::add-mask::$GH_APP_TOKEN"
          git push "https://x-access-token:${GH_APP_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/main"
